<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mtnview</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage" tabindex="0" aria-label="mtnview TV Launcher">
    <div class="scene" id="scene">
      <div class="home" id="home">
        <div class="backdrop" id="backdrop">
          <video class="aerial" id="aerial0" autoplay muted playsinline preload="auto"></video>
          <video class="aerial" id="aerial1" muted playsinline preload="none"></video>
          <div class="vignette"></div>
          <div class="night-veil"></div>
        </div>
        <button type="button" tabindex="-1" class="top-pill settings-pill" id="settingsBtn" data-z="util" data-action="settings" aria-label="Settings"></button>
        <div class="top-pill clock-pill" id="clockPill"></div>
        <div class="stage-body" id="stageBody"></div>
        <div class="ambient" id="ambient" aria-hidden="true"></div>
        <div class="loc" id="loc" aria-hidden="true"></div>
        <div class="toast" id="toast" aria-live="polite"></div>
        <div class="oled-black" aria-hidden="true"></div>
      </div>
    </div>
    <section class="overlay" id="overlay" hidden role="dialog" aria-modal="true"></section>
  </main>
<script src="device.js"></script>
<script src="main.js"></script>
</body>
</html>
