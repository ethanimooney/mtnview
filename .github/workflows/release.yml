name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run checks & unit tests
        run: |
          node --check app/main.js
          node --check app/device.js
          node --check tv-backup/mtnview-home.js
          ! grep -nE '(^|[{; ])(inset|gap):' app/style.css
          node --test scripts/test-webos-device.mjs
      - name: Build .ipk & SHA-256 checksum
        run: |
          node scripts/package-webos.mjs
          cd dist && sha256sum *.ipk > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.ipk dist/SHA256SUMS.txt \
            --title "mtnview ${GITHUB_REF_NAME}" \
            --generate-notes
