name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mtnview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax & compatibility checks
        run: |
          node --check app/main.js
          node --check app/device.js
          node --check tv-backup/mtnview-home.js
          sh -n scripts/deploy-lg.sh scripts/download-aerials.sh scripts/sync-aerials-lg.sh scripts/restore-tv.sh tv-backup/init.d/10-adblock-hosts tv-backup/init.d/99-mtnview tv-backup/init.d/99-mtnview-home
          ! grep -nE '(^|[{; ])(inset|gap):' app/style.css
          node -e 'const a = require("./app/appinfo.json"); if (a.id !== "com.mtnview.launcher" || !Array.isArray(a.appCategory)) process.exit(1);'
      - name: Run LG webOS device unit tests
        run: node --test scripts/test-webos-device.mjs
      - name: Build LG webOS .ipk package
        run: node scripts/package-webos.mjs
